name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - name: Install lftp
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if sudo timeout 90 apt-get update; then break; else
              echo "apt-get update intento $i fallo/intento colgado -> reintentando"
              sudo pkill -9 apt-get 2>/dev/null || true
              sleep 5
            fi
          done
          sudo apt-get install -y lftp

      - name: Prepare panel secret
        run: |
          mkdir -p deploy-secret
          if [ -n "${{ secrets.PANEL_PASSWORD }}" ]; then
            echo "${{ secrets.PANEL_PASSWORD }}" > deploy-secret/panel-secret.txt
            echo "PANEL_PASSWORD presente -> se actualizara el panel-secret.txt del servidor."
          else
            echo "PANEL_PASSWORD no definido -> el panel-secret.txt del servidor NO se tocara (si no existe, el login quedara bloqueado hasta crearlo)."
          fi
          echo "Listo."

      - name: Upload to cPanel via lftp
        run: |
          lftp -c "
            set ssl:verify-certificate no
            set ftp:ssl-allow true
            set ftp:ssl-protect-data true
            open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }}
            mirror --reverse --delete --exclude api/data/ --exclude api/uploads/ --exclude radio.solperuradio.es/ --exclude cgi-bin/ --exclude \.user\.ini --exclude \.well-known/ --verbose dist/ /public_html
          "
          lftp -c "
            set ssl:verify-certificate no
            set ftp:ssl-allow true
            set ftp:ssl-protect-data true
            open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }}
            mirror --reverse --no-perms --exclude data/ --exclude uploads/ --verbose public/api/ /public_html/api/
          "
          if [ -f deploy-secret/panel-secret.txt ]; then
            lftp -c "
              set ssl:verify-certificate no
              set ftp:ssl-allow true
              set ftp:ssl-protect-data true
              open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }}
              put deploy-secret/panel-secret.txt -o /public_html/api/data/panel-secret.txt
              quit
            "
          fi
          echo "Deploy completo."